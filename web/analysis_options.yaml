include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treated as errors rather than warnings so a stale import or an unused field cannot
    # accumulate quietly in a codebase this size.
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Switched off deliberately, not out of preference: it fires on every bloc here and its
    # suggestion does not compile. Dart forbids a named parameter beginning with an underscore, so
    # `required this._getHosts` is a syntax error — and these constructors have three or four
    # dependencies each, which is exactly where named parameters earn their keep.
    prefer_initializing_formals: false

    # Every widget in this app is const-constructible where it can be, and forgetting it on a
    # frequently-rebuilt row is a real cost when a poll re-emits.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_single_quotes: true

    # The comment convention this repository uses throughout — say *why*, and name the file at the
    # other end of a coupling — is worth enforcing at least to the extent of requiring the doc
    # comment exist on anything public.
    slash_for_doc_comments: true
