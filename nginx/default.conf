upstream patching_api {
    # "api" resolves via Docker's embedded DNS on the net-web network.
    server api:8080;
}

# nginx has no built-in "just the client cert's CN" variable — only the full Subject DN
# ($ssl_client_s_dn, e.g. "CN=ABC123"). CaService only ever issues agent certificates with a
# single-RDN subject of exactly that form, so this map is a safe, simple extraction rather than a
# general DN parser.
map $ssl_client_s_dn $ssl_client_cn {
    default "";
    "~^CN=(?<CN>.+)$" $CN;
}

# The app builds its own public URLs — the OIDC redirect_uri above all — from the forwarded pair
# below, so these have to name the address the *browser* used, not the one nginx was reached on.
# Both maps keep an existing value rather than overwriting it: when something else fronts this
# nginx, that outer proxy already recorded the real client-facing host and scheme, and stamping
# $host/$scheme over them would replace the browser's address with this server's own. That is
# exactly the failure this fixes, so it must not be reintroduced here. With nothing in front, no
# X-Forwarded-* arrives and the defaults below are the browser's values anyway.
map $http_x_forwarded_host $client_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else moves to TLS — this is where the agent's own identity gets checked
    # (client-certificate verification, below), so plaintext HTTP must never carry real traffic.
    # The :8443 here must match WEB_TLS_PORT in .env (see docker-compose.yml) — nginx config
    # doesn't get environment substitution the way docker-compose.yml itself does.
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The agent fleet's own CA (generated and held by the API — see CaService in
    # Kintsugi.Infrastructure) — distinct from the server's own certificate above. A client
    # certificate is *optional* at the TLS layer here (this port also serves the plain browser
    # admin UI, which has no client cert) but *required*, below, on the handful of routes only an
    # enrolled agent should ever call.
    ssl_client_certificate /etc/nginx/agent-ca/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 5m comfortably covers ordinary API/browser traffic; raised for the whole server so a
    # published kintsugi-agent installer package (POST /api/agent-packages) isn't rejected before
    # it ever reaches the API — see AgentPackagesController.Publish.
    client_max_body_size 200m;

    # The default 4k/8k response-header buffer is too small for /signin-oidc: the OIDC handler's
    # response there clears the correlation/nonce cookies and writes the auth cookie in the same
    # response, and with Auth0 claims included that easily exceeds it — nginx 502s with "upstream
    # sent too big header" instead of truncating. Raised for the whole server rather than just
    # `location /` so the same handshake never breaks depending on which provider (Auth0, Entra ID,
    # Google) or how many claims/roles it sends.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;

    # nginx's TLS-layer pseudo-statuses, remapped so a rejected certificate is legible. Without
    # these, 495 goes out on the wire as a bare 400 with an HTML body reading "The SSL certificate
    # error" — indistinguishable from an ordinary malformed request, and reported by the agent as
    # nothing more than "request rejected (HTTP 400 Bad Request)".
    #
    # The trap is worse than the wording, and it is why the 403 in the agent block below is not the
    # whole story: 495 is raised during request processing, *before* any location is matched. So
    # that block's `$ssl_client_verify != SUCCESS` test only ever sees NONE — a certificate that
    # was presented and failed to verify never reaches it. `optional` means "verify it if one is
    # offered", not "tolerate a bad one"; only `optional_no_ca` would do that, and it must not be
    # used here because verification against the fleet CA is the entire security property.
    #
    # The distinction the two messages draw is the one worth having at 3am: no certificate at all
    # usually means an unenrolled agent or a TLS-terminating proxy in front eating it, whereas a
    # rejected one almost always means the fleet CA was regenerated out from under an already
    # enrolled agent — see the agent-ca-private/agent-ca-public volumes in docker-compose.yml,
    # which must survive a redeploy for exactly this reason.
    error_page 495 = @agent_cert_rejected;
    error_page 496 = @agent_cert_missing;

    location @agent_cert_rejected {
        default_type text/plain;
        return 403 "Request not authorized: this agent's client certificate was not accepted by the fleet CA. If this agent was enrolled successfully before, the CA has most likely been regenerated (see the agent-ca-private / agent-ca-public volumes); the agent must re-enroll.\n";
    }

    location @agent_cert_missing {
        default_type text/plain;
        return 403 "Request not authorized: no client certificate was presented.\n";
    }

    # The agent-only surface: host/application registration, application- and OS-level
    # patch-result reporting, the agent's final removal confirmation (host-removed), and the two
    # read endpoints an agent polls (patching policy, its own upgrade statuses). Exact-match ($)
    # deliberately excludes both /api/host/enroll (see below — an unenrolled agent can't present a
    # cert yet) and the browser/JS-driven sub-routes under /api/upgrade-paths/... (scan, refresh,
    # prompt, save — see Applications.cshtml), which stay reachable from an ordinary browser
    # session — as well as the admin-only DELETE /api/hosts/{id} (plural, so it never matches this
    # regex), which is browser-initiated and carries no agent certificate at all.
    location ~ ^/api/(host|applications|patching-policy|upgrade-paths|patch-results|os-patch-results|host-removed)$ {
        # Not `return 495` — that's nginx's internal pseudo-status for a TLS-layer certificate
        # failure, and without an `error_page 495 = ...` remap it actually goes out on the wire as
        # a bare 400, indistinguishable from an ordinary bad request. An explicit 403 is
        # unambiguous in agent logs. (`default_type`/`add_header` aren't valid inside `if`, so this
        # goes out as text/plain rather than matching the API's own problem+json responses.)
        if ($ssl_client_verify != SUCCESS) {
            return 403 "Request not authorized: a valid agent client certificate is required.";
        }

        proxy_pass http://patching_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host $client_host;
        # The one piece of the client certificate the API actually trusts: its Subject CN, which
        # enrollment always sets to the host's serial number. Safe to forward as a plain header
        # only because net-data/net-web topology means nothing but this nginx can reach the api
        # service — see docker-compose.yml.
        proxy_set_header X-Agent-Cert-Cn $ssl_client_cn;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The agent package endpoints stay reachable with no client certificate at all — the Clients
    # page needs to work from a plain browser, and even an already-enrolled agent's self-update
    # check has to be able to see what's published before it has ever proven anything (see
    # AgentPackagesController). Unlike the agent-only block above, nothing here is rejected for
    # lacking one. When a certificate *is* presented and verifies, though, the app needs to know:
    # AgentPackagesController.Download uses this to skip rewriting the enrollment token into an
    # already-enrolled agent's own download, since that agent doesn't need one and the rewrite
    # would otherwise change the archive's bytes enough to fail the checksum signed at publish
    # time.
    location ^~ /api/agent-packages {
        proxy_pass http://patching_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host $client_host;
        proxy_set_header X-Agent-Cert-Verified $ssl_client_verify;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # nginx is the only ingress: everything else (REST API + /swagger docs + the admin UI) is
    # reverse-proxied to the API service, which is not otherwise reachable.
    location / {
        proxy_pass http://patching_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host $client_host;

        proxy_connect_timeout 5s;
        # Both the fleet-wide scan and the per-application refresh (see
        # UpgradePathScanCoordinator / UpgradePathRefreshCoordinator) run AI research as
        # background jobs polled over separate short requests, so no single request should need to
        # block on an AI provider call for long. A generous default in case that assumption
        # changes.
        proxy_read_timeout 60s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
